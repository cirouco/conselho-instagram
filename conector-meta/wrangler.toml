name = "conector-meta-instagram"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
GRAPH_VERSION = "v26.0"
# Opcional: ID da conta do Instagram da agência usada para o Business Discovery (concorrentes).
# Se vazio, usa a primeira conta encontrada.
DEFAULT_IG_USER_ID = ""

# Segredos (NÃO coloque aqui; use `npx wrangler secret put NOME`):
#   META_TOKEN        token do Usuário do Sistema do Business Manager
#   CONNECTOR_SECRET  texto aleatório longo que faz parte da URL do conector
#   META_APP_SECRET   (recomendado) chave secreta do app, para assinar as chamadas (appsecret_proof)
